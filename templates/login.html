{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-6 col-lg-4">
    <div class="card card-lift">
      <div class="card-body">
        <h2 class="h5 mb-3"><i class="bi bi-shield-lock text-primary me-2"></i>Accesso amministratore</h2>
        <form method="post">
          {{ form.csrf_token }}
          <div class="mb-3">
            {{ form.password.label(class='form-label') }}
            {{ form.password(class='form-control', placeholder='Password admin') }}
          </div>
          <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Accedi</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
